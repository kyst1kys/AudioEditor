spring.application.name=audio-editor

# Шлях до файлу. ./audio_editor_db створить файл прямо в папці твого проєкту
spring.datasource.url=jdbc:h2:file:./audio_editor_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Щоб бачити в консолі, які SQL-запити генерує програма
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true